controller_manager:
  ros__parameters:
    update_rate: 30

    mecanum_base_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_base_controller:
  ros__parameters:
    reference_timeout: 0.5

    front_left_wheel_command_joint_name:  "wheel_front_left_joint"
    front_right_wheel_command_joint_name: "wheel_front_right_joint"
    rear_right_wheel_command_joint_name:  "wheel_back_right_joint"
    rear_left_wheel_command_joint_name:   "wheel_back_left_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.03
      sum_of_robot_center_projection_on_X_Y_axis: 0.22 # 14cm + 8cm

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true

    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

